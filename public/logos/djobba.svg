<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="djobba-spine-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="40%" stop-color="#3ECF8E" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="djobba-arrow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#3ECF8E" />
    </linearGradient>

    <filter id="djobba-svg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3ECF8E" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#djobba-svg-glow)">
    <!-- Main "D" Arch -->
    <path
      d="M26 80V20c0-2.8 2.2-5 5-5h22c17.67 0 32 14.33 32 32s-14.33 32-32 32H31c-2.8 0-5-2.2-5-5z"
      fill="none"
      stroke="url(#djobba-spine-grad)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Kinetic Forward Chevron (Jobs & Contracts Velocity) -->
    <path
      d="M44 38l14 12-14 12"
      fill="none"
      stroke="url(#djobba-arrow-grad)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Center Connection Node -->
    <circle cx="39" cy="50" r="3" fill="#A7F3D0" />
  </g>
</svg>
